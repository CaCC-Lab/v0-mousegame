<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="512" cy="512" r="480" fill="#F0F9FF" stroke="#3B82F6" stroke-width="40"/>
  
  <!-- Basket -->
